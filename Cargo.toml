[package]
authors = [ "leotrs <leo@leotrs.com>" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "rsm mark-up language"
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "rsm" ]
license = "MIT"
name = "tree-sitter-rsm"
readme = "README.md"
repository = "https://github.com/aris-pub/tree-sitter-rsm"
version = "1.5.0"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.2"
