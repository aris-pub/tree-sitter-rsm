[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=62.4.0", "wheel" ]

[project]
authors = [ { email = "leo@leotrs.com", name = "leotrs" } ]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
description = "rsm mark-up language"
keywords = [ "incremental", "parsing", "tree-sitter", "rsm" ]
license.text = "MIT"
name = "tree-sitter-rsm"
readme = "README.md"
requires-python = ">=3.11"
version = "1.5.0"

[project.urls]
Homepage = "https://github.com/aris-pub/tree-sitter-rsm"

[project.optional-dependencies]
core = [ "tree-sitter>=0.26,<0.27" ]

[tool.cibuildwheel]
build = "cp311-*"
build-frontend = "build"
